name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install public dependencies (CPU PyTorch)
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run complete offline test suite
        working-directory: backend
        env:
          HF_HOME: ${{ runner.temp }}/docuagent-empty-hf
          SENTENCE_TRANSFORMERS_HOME: ${{ runner.temp }}/docuagent-empty-st
          PYTHONPATH: ${{ github.workspace }}/ci/offline_guard
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -c "import sitecustomize; assert sitecustomize.NETWORK_GUARD_ACTIVE"
          python -m pytest -v
